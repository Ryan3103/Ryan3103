
name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Ryan3103
          template: classic
          filename: profile/github-stats.svg
          output_action: none
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo

      - name: Generate Top Languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Ryan3103
          template: classic
          filename: profile/top-langs.svg
          output_action: none
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          config_timezone: America/Sao_Paulo

      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=Ryan3103&background=0a0a0a&ring=A200FF&fire=A200FF&currStreakLabel=A200FF&sideLabels=ffffff&currStreakNum=ffffff&sideNums=ffffff&dates=ffffff&hide_border=true&disable_animations=true
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Copy generated metrics
        run: |
          mkdir -p profile

          echo "Arquivos gerados pelo Metrics:"
          sudo ls -lah /metrics_renders/profile/

          sudo cp /metrics_renders/profile/github-stats.svg profile/
          sudo cp /metrics_renders/profile/top-langs.svg profile/

      - name: Commit generated cards
        run: |
          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update GitHub stats cards"
          git push
